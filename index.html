<!-- Firebase SDKs via CDN Oficial (Compatível com GitHub Pages) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-p80ab2chWCfTQbSBqvJ5x3Qi_iGNQwQ",
            authDomain: "prot-bfnrm.firebaseapp.com",
            projectId: "prot-bfnrm",
            storageBucket: "prot-bfnrm.firebasestorage.app",
            messagingSenderId: "190372918923",
            appId: "1:190372918923:web:ede314e2613cd7a125c68e",
            measurementId: "G-DEW1QXWWLD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sectorsList = [
            '01 - Comandante',
            '02 - Imediato',
            '03 - Secretaria do Comando',
            '03.2 - Centro de Mensagem',
            '06 - Assessoria de Inteligência',
            '10 - Administrativo',
            '20 - Material',
            '30 - Intendência',
            'ComFFE',
            'ComDivRib',
            'BtlLogFN',
            'BtlEngFN'
        ];

        let listaProtocolosCache = [];

        const form = document.getElementById('protocol-form');
        const tableBody = document.getElementById('protocol-table-body');
        const statTotal = document.getElementById('stat-total');
        const statPendente = document.getElementById('stat-pendente');
        const statConcluido = document.getElementById('stat-concluido');

        function getFormattedDateTime() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const dateOnly = `${year}-${month}-${day}`;
            return { full: `${day}/${month}/${year} ${hours}:${minutes}`, dateOnly: dateOnly };
        }

        async function carregarProtocolosDaNuvem() {
            try {
                const q = query(collection(db, "protocolos"));
                const querySnapshot = await getDocs(q);
                listaProtocolosCache = [];
                
                querySnapshot.forEach((docSnap) => {
                    listaProtocolosCache.push({ id: docSnap.id, ...docSnap.data() });
                });

                listaProtocolosCache.sort((a, b) => new Date(b.timestampCriacao || 0) - new Date(a.timestampCriacao || 0));
                renderTable();
            } catch (error) {
                console.error("Erro ao carregar do Firestore: ", error);
            }
        }
        window.carregarProtocolosDaNuvem = carregarProtocolosDaNuvem;

        function atualizarLista() {
            document.getElementById('filter-date').value = '';
            document.getElementById('filter-doctype').value = '';
            document.getElementById('filter-sender').value = '';
            document.getElementById('filter-sector').value = '';
            document.getElementById('filter-status').value = '';
            renderTable();
        }
        window.atualizarLista = atualizarLista;

        function renderTable() {
            tableBody.innerHTML = '';
            let total = listaProtocolosCache.length;
            let concluidos = 0;

            const fDate = document.getElementById('filter-date').value;
            const fDocType = document.getElementById('filter-doctype').value;
            const fSender = document.getElementById('filter-sender').value;
            const fSector = document.getElementById('filter-sector').value;
            const fStatus = document.getElementById('filter-status').value;

            const filtered = listaProtocolosCache.filter(p => {
                let matchDate = fDate ? (p.dateOnly === fDate) : true;
                let matchDocType = fDocType ? (p.docType === fDocType) : true;
                let matchSender = fSender ? (p.sender === fSender) : true;
                let matchSector = fSector ? (p.currentSector === fSector) : true;
                let matchStatus = fStatus ? (p.status === fStatus) : true;

                return matchDate && matchDocType && matchSender && matchSector && matchStatus;
            });

            filtered.forEach((p) => {
                if (p.status === 'Concluído') concluidos++;

                let badgeClass = 'badge-tramite';
                if (p.status === 'Em Análise') badgeClass = 'badge-analise';
                if (p.status === 'Concluído') badgeClass = 'badge-concluido';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <strong>${p.protocolNum}</strong>
                        <small style="color: #6b7280; font-size: 0.70rem; display:block; margin-top:2px;">${p.dateTime}</small>
                    </td>
                    <td>
                        <span class="sector-tag" style="background:#e0f2fe; color:#0369a1;">${p.docInfo}</span>
                    </td>
                    <td>${p.sender}</td>
                    <td>${p.subject}</td>
                    <td>
                        <span class="sector-tag">${p.currentSector}</span>
                        <span class="history-sub">Atualizado em: ${p.sectorUpdateDateTime || p.dateTime}</span>
                    </td>
                    <td>
                        <span class="badge ${badgeClass}">${p.status}</span>
                        <span class="history-sub">Atualizado em: ${p.statusUpdateDateTime || p.dateTime}</span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="forwardDocument('${p.id}')">Encaminhar</button>
                            <button class="action-btn" onclick="toggleStatus('${p.id}')" style="background:#f0fdf4; border-color:#bbf7d0; color:#059669;">Estado</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            statTotal.textContent = total;
            statPendente.textContent = total - concluidos;
            statConcluido.textContent = concluidos;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const docType = document.getElementById('doc-type').value;
            const docNumInput = document.getElementById('doc-num-input').value.trim();
            const fullDocInfo = `${docType}-${docNumInput}`;

            const sender = document.getElementById('doc-sender').value;
            const currentSector = document.getElementById('doc-current-sector').value;
            const subject = document.getElementById('doc-subject').value;
            
            const dt = getFormattedDateTime();
            const ano = new Date().getFullYear();
            const novoProt = `PROT-${ano}-${String(listaProtocolosCache.length + 1).padStart(3, '0')}`;

            const novoRegisto = { 
                protocolNum: novoProt,
                docType: docType,
                docInfo: fullDocInfo, 
                sender: sender, 
                subject: subject, 
                currentSector: currentSector,
                sectorUpdateDateTime: dt.full,
                status: 'Em Trâmite',
                statusUpdateDateTime: dt.full,
                dateTime: dt.full,
                dateOnly: dt.dateOnly,
                timestampCriacao: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "protocolos"), novoRegisto);
                form.reset();
                await carregarProtocolosDaNuvem();
                alert('Documento protocolado e guardado na nuvem com sucesso!');
            } catch (error) {
                console.error("Erro ao salvar no Firestore: ", error);
                alert('Erro ao guardar documento na nuvem.');
            }
        });

        window.forwardDocument = async function(id) {
            let p = listaProtocolosCache.find(item => item.id === id);
            if (!p) return;

            let promptText = `Documento atualmente em: [ ${p.currentSector} ]\n\nEscolha o próximo setor de destino digitando o número:\n`;
            sectorsList.forEach((sec, idx) => {
                promptText += `${idx + 1} - ${sec}\n`;
            });

            let choice = prompt(promptText);
            if (choice !== null && choice.trim() !== '') {
                let choiceNum = parseInt(choice) - 1;
                if (choiceNum >= 0 && choiceNum < sectorsList.length) {
                    const novoSetor = sectorsList[choiceNum];
                    const dataAtual = getFormattedDateTime().full;

                    try {
                        const docRef = doc(db, "protocolos", id);
                        await updateDoc(docRef, {
                            currentSector: novoSetor,
                            sectorUpdateDateTime: dataAtual
                        });
                        await carregarProtocolosDaNuvem();
                    } catch (error) {
                        console.error("Erro ao atualizar setor: ", error);
                    }
                } else {
                    alert('Opção inválida de setor.');
                }
            }
        }

        window.toggleStatus = async function(id) {
            let p = listaProtocolosCache.find(item => item.id === id);
            if (!p) return;

            const states = ['Em Trâmite', 'Em Análise', 'Concluído'];
            let currentIndex = states.indexOf(p.status);
            let nextIndex = (currentIndex + 1) % states.length;
            const novoEstado = states[nextIndex];
            const dataAtual = getFormattedDateTime().full;

            try {
                const docRef = doc(db, "protocolos", id);
                await updateDoc(docRef, {
                    status: novoEstado,
                    statusUpdateDateTime: dataAtual
                });
                await carregarProtocolosDaNuvem();
            } catch (error) {
                console.error("Erro ao atualizar estado: ", error);
            }
        }

        carregarProtocolosDaNuvem();
    </script>
